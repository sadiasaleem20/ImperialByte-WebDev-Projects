<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pakistan Quiz</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="text-center mb-4">
            <h1 class="fw-bold text-success">Pakistan Quiz</h1>
            <p class="text-muted">Test your knowledge about Pakistan</p>
          </div>

          <div class="card shadow-sm">
            <div class="card-body p-4">
              <!-- Start Screen -->
              <div id="start-screen" class="text-center">
                <h4 class="mb-3">Ready to test your knowledge?</h4>
                <p class="text-muted mb-4">
                  There are 5 questions. Choose the best answer for each.
                </p>
                <button id="start-btn" class="btn btn-success btn-lg px-4">
                  Start Quiz
                </button>
              </div>

              <!-- Quiz Screen -->
              <div id="quiz-screen" class="d-none">
                <div class="d-flex justify-content-between mb-2">
                  <span id="question-number" class="fw-semibold"></span>
                  <span
                    id="score-display"
                    class="text-success fw-semibold"
                  ></span>
                </div>

                <div class="progress mb-4" role="progressbar">
                  <div
                    id="progress-bar"
                    class="progress-bar bg-success"
                    style="width: 0%"
                  ></div>
                </div>

                <h5 id="question-text" class="mb-4"></h5>

                <div id="options-container" class="d-grid gap-2 mb-3"></div>

                <div id="feedback" class="alert d-none" role="alert"></div>

                <div class="text-end">
                  <button id="next-btn" class="btn btn-success d-none">
                    Next Question
                  </button>
                </div>
              </div>

              <!-- Result Screen -->
              <div id="result-screen" class="text-center d-none">
                <h2 class="mb-3">Quiz Completed!</h2>
                <p class="fs-4">
                  Your Score:
                  <span id="final-score" class="fw-bold text-success"></span> /
                  5
                </p>
                <p id="result-message" class="text-muted mb-4"></p>
                <button id="restart-btn" class="btn btn-success btn-lg px-4">
                  Restart Quiz
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
